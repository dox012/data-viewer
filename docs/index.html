    const term = search.value.trim().toLowerCase();
    const rows = DATASETS.filter(d => !term || `${d.name} ${d.kind} ${d.data_label || ''} ${d.summary}`.toLowerCase().includes(term));
    totals.innerHTML = [`<span class="badge">${rows.length} 个显示</span>`,`<span class="badge">${DATASETS.length} 个总计</span>`,`<span class="badge">${DATASETS.filter(d => d.warnings && d.warnings.length).length} 个有警告</span>`].join('');
